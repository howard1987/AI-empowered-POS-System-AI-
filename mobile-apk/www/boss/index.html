<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#20663f">
<title>老板看板</title>
<style>
  :root{
    --paper:#f5f2ea; --paper-2:#efeadd; --card:#fffdf7;
    --ink:#22301f; --ink-2:#5a6650; --ink-3:#8a947e;
    --pri:#20663f; --pri-d:#174a2e; --pri-2:#2e8557; --green-soft:#e2efe2;
    --orange:#e4682a; --orange-soft:#fbe7d8;
    --red:#c0392b; --red-soft:#f9e2dd;
    --blue:#2a6f8e; --blue-soft:#dfeaef;
    --gold:#b98a1c; --gold-soft:#f5ecd2;
    --line:#ddd6c4; --line-2:#c9c1ab;
    --ok:#2e7a4e; --bad:#c0392b;
    --r:10px; --r-lg:16px;
    --shadow:0 1px 2px rgba(40,50,30,.06), 0 8px 24px -12px rgba(40,50,30,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    background:
      radial-gradient(600px 340px at 100% 0%, rgba(46,133,87,.08), transparent 60%),
      radial-gradient(500px 300px at 0% 100%, rgba(228,104,42,.06), transparent 55%),
      var(--paper);
    color:var(--ink); font-size:15px; user-select:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  input,select,textarea{user-select:text; font:inherit; color:var(--ink);}
  button{font:inherit; border:none; background:none; cursor:pointer; color:inherit;}
  .hidden{display:none !important;}

  /* ── 登录 ── */
  #auth{
    min-height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    background:linear-gradient(160deg,#174a2e 0%,#20663f 55%,#2e8557 100%);
  }
  #auth .logo{
    width:72px; height:72px; margin:0 auto 14px; border-radius:20px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:36px; box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  #auth h1{color:#fff; text-align:center; font-size:22px; letter-spacing:1px;}
  #auth p{color:#d7e4c9; text-align:center; margin:6px 0 30px; font-size:13px;}
  .card{
    background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:16px;
    border:1px solid var(--line);
  }
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--ink-3); margin-bottom:6px;}
  .field input{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:16px; background:#fff; outline:none;
  }
  .field input:focus{border-color:var(--pri-2);}
  .btn{
    display:block; width:100%; padding:13px; border-radius:12px; font-size:16px; font-weight:600;
    text-align:center; background:var(--pri); color:#f7f3e6;
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:#fff; color:var(--pri); border:1px solid var(--pri);}
  .err{color:#ffd7cc; font-size:13px; min-height:18px; margin-bottom:8px; text-align:center;}

  /* ── 主框架 ── */
  /* V5.0.13 修复（真机通病）：该机 WebView 不支持 100dvh（CSS.supports 为 false）→ 整条 height 失效，
   * #app 塌成内容高 → 底部 Tab 浮在内容中间、被内容遮挡点不到。先写 100vh 兜底再写 dvh 渐进增强，
   * 并给 header/#view/nav 明确 flex 约束（min-height:0 是 flex 子项允许收缩的关键）。 */
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:640px; margin:0 auto;}
  header{
    flex-shrink:0;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:linear-gradient(160deg,#174a2e,#20663f 55%,#2e8557); color:#f7f3e6;
    box-shadow:0 1px 4px rgba(23,74,46,.25);
  }
  header .hd-t{display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700;}
  header .hd-sub{font-size:11.5px; color:#cfe6cf; margin-top:3px; line-height:1.5;}
  #view{flex:1; min-height:0; overflow-y:auto; padding:12px 12px 20px; touch-action:pan-y; position:relative; will-change:transform; -webkit-overflow-scrolling:touch;}

  /* ── 底部 Tab ── */
  nav{
    flex-shrink:0; position:relative; z-index:5;
    display:flex; background:var(--card); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav .tab{
    flex:1; padding:8px 0 6px; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--ink-3); font-size:11px; position:relative;
  }
  nav .tab .ic{font-size:20px; line-height:1;}
  nav .tab.on{color:var(--pri); font-weight:600;}
  nav .tab .bd{position:absolute; top:3px; left:calc(50% + 8px); background:var(--red); color:#fff; font-size:9.5px; min-width:16px; height:16px; line-height:16px; border-radius:99px; padding:0 4px; font-weight:700;}

  /* ── 通用 ── */
  .sec{font-size:12.5px; color:var(--ink-3); margin:14px 2px 8px; font-weight:600;}
  .row{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; margin-bottom:8px; display:flex; align-items:center; gap:10px;
    box-shadow:var(--shadow);
  }
  .row .grow{flex:1; min-width:0;}
  .row .t{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .s{font-size:12px; color:var(--ink-3); margin-top:2px; line-height:1.5;}
  .pill{font-size:11px; padding:2px 8px; border-radius:99px; flex-shrink:0; font-weight:600;}
  .pill.gray{background:var(--paper-2); color:var(--ink-2);}
  .pill.blue{background:var(--blue-soft); color:var(--blue);}
  .pill.green{background:var(--green-soft); color:var(--pri);}
  .pill.orange{background:var(--orange-soft); color:#b34f18;}
  .pill.red{background:var(--red-soft); color:var(--red);}
  .pill.yellow{background:var(--gold-soft); color:#7a5d10;}
  .kv{display:flex; justify-content:space-between; padding:7px 0; font-size:14px; border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:none;}
  /* V5.0.14f：标签不再被长内容挤到换行（"依据"两字竖排问题）；值占满剩余宽度自然均分行 */
  .kv .k{color:var(--ink-3); white-space:nowrap; flex:none; margin-right:10px;}
  .kv .v{font-weight:600; text-align:right; flex:1; min-width:0; word-break:break-word; line-height:1.45;}
  .num{font-variant-numeric:tabular-nums;}
  .hint{font-size:12.5px; color:var(--ink-3); margin:8px 2px 0; line-height:1.5;}
  .empty{text-align:center; color:var(--ink-3); font-size:13px; padding:26px 0; line-height:1.8;}
  .toast{
    position:fixed; left:50%; top:18%; transform:translateX(-50%); z-index:99;
    background:rgba(23,36,25,.92); color:#f7f3e6; padding:10px 18px; border-radius:10px;
    font-size:14px; max-width:82vw; text-align:center; transition:opacity .2s;
  }

  /* ── 实时提醒（原型：白卡 + 圆点分类）── */
  .alert-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow);}
  .alert-card b{font-size:13px;}
  .alert-card .al-line{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:12.5px;}
  .alert-card .al-line:last-of-type{border-bottom:none;}

  /* ── 今日经营 KPI ── */
  .kpis{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; box-shadow:var(--shadow);}
  .kpi .l{font-size:11.5px; color:var(--ink-3);}
  .kpi .v{font-size:20px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums;}
  .kpi .v.g{color:var(--pri);} .kpi .v.o{color:var(--orange);}

  /* ── 分红卡 ── */
  .div-card{
    background:linear-gradient(160deg,#fdf1e3,#fff); border:1px solid var(--orange); border-radius:12px;
    padding:12px; box-shadow:var(--shadow);
  }
  .div-card b{font-size:13px;}
  .div-card .dv-line{display:flex; justify-content:space-between; margin-top:7px; font-size:12.5px; color:var(--ink-2);}
  .div-card .dv-line b{font-size:14px; color:var(--orange);}

  /* ── 宫格（原型：2 列白卡）── */
  .egrid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .e-card{
    background:var(--card); border:1px solid var(--line); border-radius:11px; padding:11px 10px;
    display:flex; flex-direction:column; align-items:flex-start; gap:3px; box-shadow:var(--shadow); text-align:left;
  }
  .e-card .eic{font-size:21px; line-height:1;}
  .e-card b{font-weight:700; font-size:12.5px; margin-top:2px;}
  .e-card small{font-size:11px; color:var(--ink-3); line-height:1.4;}
  .e-card:active{transform:scale(.97);}

  /* ── 报表：柱图 / 环形图 ── */
  /* V5.0.13 修复：.bar 的百分比高度相对 .b 解析，.b 必须 = 容器等高（否则柱高塌成 min-height 2px） */
  .bars{display:flex; align-items:stretch; gap:7px; height:120px; padding:4px 2px 0;}
  .bars .b{flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px;}
  .bars .bar{width:100%; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,#4d8a54,#20663f); min-height:2px;}
  .bars .bar.hot{background:linear-gradient(180deg,#e8912d,#d4791a);}
  .bars .lb{font-size:9.5px; color:var(--ink-3);}
  .bars .vl{font-size:9px; color:var(--ink-3);}
  .ring-wrap{display:flex; gap:14px; align-items:center;}
  .ring{width:96px; height:96px; border-radius:50%; position:relative; flex:0 0 auto; background:conic-gradient(var(--pri) 0 var(--p1), var(--orange) var(--p1) calc(var(--p1) + var(--p2)), #c9c1ab 0);}
  .ring::after{content:""; position:absolute; inset:22px; background:var(--card); border-radius:50%;}
  .ring .rc{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1;}
  .ring .rc b{font-size:12px;}
  .ring .rc small{font-size:8.5px; color:var(--ink-3);}
  .ring-legend{flex:1; display:grid; gap:5px; font-size:11.5px;}
  .ring-legend .rl{display:flex; align-items:center; gap:6px;}
  .ring-legend .rl i{width:9px; height:9px; border-radius:2px; flex:0 0 auto;}
  .ring-legend .rl b{margin-left:auto; font-variant-numeric:tabular-nums;}

  /* ── V4.9.8：返回导航 ── */
  .back{
    flex:0 0 auto; width:30px; height:30px; margin-left:-4px; border-radius:9px;
    background:rgba(255,255,255,.14); color:#fff; font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0 0 3px;
  }
  .back:active{transform:scale(.93);}
  #hdTitle{font-size:17px; font-weight:700;}

  /* ── V4.9.8：移动端报表表格（横向滚动 + 冻结首列）── */
  .tw{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; border:1px solid var(--line); background:var(--card);}
  table.tb{border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap;}
  table.tb th,table.tb td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line);}
  table.tb th{background:var(--paper-2); color:var(--ink-2); font-weight:600; font-size:11.5px; position:sticky; top:0;}
  table.tb th:first-child,table.tb td:first-child{text-align:left; position:sticky; left:0; background:var(--card); z-index:1;}
  table.tb th:first-child{background:var(--paper-2);}
  table.tb td.n{font-variant-numeric:tabular-nums;}
  table.tb tr:last-child td{border-bottom:none;}
  table.tb tfoot td{font-weight:800; background:var(--paper-2);}
  .chipbar{display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px;}
  .chipbar .chip{flex:0 0 auto; padding:6px 12px; border-radius:99px; background:#fff; border:1px solid var(--line-2); font-size:12.5px; color:var(--ink-2);}
  .chipbar .chip.on{background:var(--pri); border-color:var(--pri); color:#fff; font-weight:600;}
  .dbar{display:flex; gap:8px; align-items:center; margin:10px 0 2px;}
  .dbar input{flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:#fff;}

  /* ── V4.9.8：审批操作 ── */
  /* V5.0.13：操作按钮吸附视口底部，内容超出时滚动展示（不被内容顶走/遮挡） */
  .acts{position:sticky; bottom:0; z-index:3; display:flex; gap:10px; margin-top:14px;
    padding:10px 2px calc(10px + env(safe-area-inset-bottom)); background:var(--paper);}
  .acts .btn{flex:1;}
  .btn.bad{background:var(--red);}
  .btn.bad:active{background:#a33125;}
  .btn[disabled]{opacity:.5;}
  .sheet-mask{position:fixed; inset:0; background:rgba(20,25,15,.45); display:flex; align-items:flex-end; z-index:50;}
  .sheet{background:var(--card); width:100%; max-width:640px; margin:0 auto; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
  .sheet h3{font-size:15px; margin-bottom:8px;}
  .sheet-back{background:none; font-size:12.5px; color:var(--ink-3); padding:0 0 8px;}
  .signwrap{border:1px dashed var(--line-2); border-radius:10px; background:#fff; margin-top:8px;}
  .signwrap canvas{width:100%; height:150px; display:block; touch-action:none;}

  /* ── 本月营业热力格 ── */
  .heat-cal{margin-top:4px;}
  .heat-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .heat-head .t{font-size:13px; font-weight:600;}
  .heat-metric{display:flex; gap:6px;}
  .heat-metric button{font-size:11px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:#fff; color:var(--ink-2);}
  .heat-metric button.on{background:var(--pri); border-color:var(--pri); color:#fff; font-weight:600;}
  .heat-wd{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:10.5px; color:var(--ink-3); margin-bottom:4px;}
  .heat-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .heat-cell{aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; font-weight:600; background:#f0f0ea; color:#999;}
  .heat-cell.other{opacity:.35;}
  .heat-cell .sub{font-size:9px; font-weight:400; opacity:.9; margin-top:1px;}
  .heat-cell.l1{background:#e2f3e2; color:#2e7a4e;} .heat-cell.l2{background:#b8e6b8; color:#2e7a4e;}
  .heat-cell.l3{background:#76c976; color:#fff;} .heat-cell.l4{background:#3a9e5c; color:#fff;}
  .heat-cell.l5{background:#20663f; color:#fff;}
  .heat-legend{display:flex; gap:6px; justify-content:flex-end; align-items:center; margin-top:8px; font-size:10px; color:var(--ink-3);}
  .heat-legend i{width:10px; height:10px; border-radius:3px; background:#f0f0ea;}
  .heat-legend i.l1{background:#e2f3e2;} .heat-legend i.l2{background:#b8e6b8;} .heat-legend i.l3{background:#76c976;} .heat-legend i.l4{background:#3a9e5c;} .heat-legend i.l5{background:#20663f;}
  .sheet-day .kv{font-size:13px;}
</style>
</head>
<body>

<!-- 登录 -->
<div id="auth">
  <div class="logo">👔</div>
  <h1>老板看板</h1>
  <p>随时随地看店 · 营业 / 分红 / 审批 / 报表（8.3）</p>
  <div class="card">
    <div class="err" id="authErr"></div>
    <div class="field">
      <label>工号</label>
      <input id="lgNo" type="text" placeholder="老板 / 店长工号" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="lgPw" type="password" placeholder="登录密码" autocomplete="current-password">
    </div>
    <button class="btn" id="lgGo">登 录</button>
  </div>
</div>

<!-- 主框架 -->
<div id="app" class="hidden">
  <header>
    <div class="hd-t">
      <button class="back hidden" id="hdBack" aria-label="返回">‹</button>
      <span id="hdTitle">👔 老板看板</span>
      <span id="hdStore" style="font-weight:400;font-size:12.5px;color:#cfe6cf">—</span>
    </div>
    <div class="hd-sub" id="hdSub">今日营业 —</div>
  </header>
  <div id="view"></div>
  <nav id="tabbar">
    <button class="tab on" data-tab="overview"><span class="ic">🏠</span>概览</button>
    <button class="tab" data-tab="approve"><span class="ic">✅</span>审批<span class="bd hidden" id="tabApproveN">0</span></button>
    <button class="tab" data-tab="reports"><span class="ic">📈</span>报表</button>
    <button class="tab" data-tab="notices"><span class="ic">🔔</span>消息<span class="bd hidden" id="tabNoticesN">0</span></button>
    <button class="tab" data-tab="settings"><span class="ic">⚙️</span>设置</button>
  </nav>
</div>

<div class="toast hidden" id="toast"></div>

<script src="./app.js" defer></script>
<script src="../tts.js" defer></script>
</body>
</html>
